[package]
name = "yt-desktop"
version = "0.1.0"
description = "Cross-platform video downloader"
authors = ["it8090"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
default-run = "yt-desktop"

[lib]
name = "yt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "socks"] }
futures-util = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
tempfile = "3"
directories = "6"
sysproxy = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
